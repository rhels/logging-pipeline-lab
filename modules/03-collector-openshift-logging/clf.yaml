# Collector service account + ClusterLogForwarder.
#
# Forwards ONLY the log-sim namespace's application logs to the Logstash
# HTTP input. The OpenShift Logging operator turns this into a Vector
# DaemonSet (one collector pod per node, named collector-* in
# openshift-logging).
#
# BEFORE APPLYING: set the output URL below to a Logstash endpoint that is
# reachable FROM the cluster's nodes/pods:
#   - Logstash in the same cluster:
#       http://logstash.observability.svc.cluster.local:8080
#   - Logstash outside the cluster: use its routable host/IP (or a Route /
#     LoadBalancer Service you created for it), e.g. http://logstash.example.com:8080
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-collector
  namespace: openshift-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: log-collector-application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-application-logs
subjects:
  - kind: ServiceAccount
    name: log-collector
    namespace: openshift-logging
---
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: collector
  namespace: openshift-logging
spec:
  serviceAccount:
    name: log-collector
  inputs:
    - name: logsim
      type: application
      application:
        includes:
          - namespace: log-sim
  outputs:
    - name: logstash
      type: http
      http:
        url: http://logstash.observability.svc.cluster.local:8080
  pipelines:
    - name: pipeline
      inputRefs:
        - logsim
      outputRefs:
        - logstash
