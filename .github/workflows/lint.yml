name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Runs on our own ARC runners on the Mac mini (Docker Desktop k8s),
    # never on GitHub-hosted runners.
    runs-on: [self-hosted, mini-k8s]
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: |
          set -e
          find . -name '*.py' -print0 | xargs -0 python3 -m py_compile
          echo "python OK"

      - name: YAML syntax check
        run: |
          set -e
          # The runner image has python3 but no pip, so fetch a static
          # yq binary for YAML parsing instead of pip-installing pyyaml.
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64 -o /tmp/yq
          chmod +x /tmp/yq
          find . -name '*.yaml' -o -name '*.yml' | grep -v '.github/workflows' | while read -r f; do
            /tmp/yq eval '.' "$f" > /dev/null || { echo "INVALID YAML: $f"; exit 1; }
          done
          echo "yaml OK"
